name: Generate Snake Animation

on:
  schedule: # run automatically every day at midnight UTC
    - cron: "0 0 * * *"
  workflow_dispatch: # allow manual trigger
  push:
    branches:
      - main
    paths:
      - .github/workflows/snake.yml

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Generate snake from contributions
        uses: Platane/snk@v3
        with:
          github_user_name: winter000boy
          outputs: |
            dist/snake.svg
            dist/snake-dark.svg?palette=github-dark&color_snake=#7F5AF0

      - name: Push generated SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
