name: Profile Summary Cards

on:
  schedule: # daily, offset from the metrics job so their pushes to main don't race
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-cards.yml

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Dark-mode cards (served via <picture> prefers-color-scheme: dark)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: winter000boy
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          THEME: tokyonight
          ANIMATION: draw

      # Light-mode cards
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: winter000boy
          BRANCH_NAME: main
          UTC_OFFSET: 5.5
          THEME: github
          ANIMATION: draw
