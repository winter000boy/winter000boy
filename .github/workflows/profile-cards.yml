name: Profile Summary Cards

on:
  schedule: # daily, offset from the metrics job so their pushes to main don't race
    - cron: "30 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/profile-cards.yml

concurrency:
  group: profile-cards
  cancel-in-progress: false

jobs:
  cards:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      # The action wipes profile-summary-card-output/ on every run, so generate
      # each theme without pushing, stash it, and commit both at the end.

      # Dark-mode cards (served via <picture> prefers-color-scheme: dark)
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: winter000boy
          UTC_OFFSET: 5.5
          THEME: tokyonight
          ANIMATION: draw
          AUTO_PUSH: false

      - name: Stash dark cards
        run: mv profile-summary-card-output/tokyonight "$RUNNER_TEMP/tokyonight"

      # Light-mode cards
      - uses: vn7n24fzkq/github-profile-summary-cards@release
        env:
          GITHUB_TOKEN: ${{ secrets.METRICS_TOKEN }}
        with:
          USERNAME: winter000boy
          UTC_OFFSET: 5.5
          THEME: github
          ANIMATION: draw
          AUTO_PUSH: false

      - name: Commit and push both themes
        run: |
          mv "$RUNNER_TEMP/tokyonight" profile-summary-card-output/tokyonight
          git config user.name "profile-summary-cards[bot]"
          git config user.email "profile-summary-cards-bot@example.com"
          git add -A profile-summary-card-output
          if git diff --cached --quiet; then
            echo "No card changes"
            exit 0
          fi
          git commit -m "Generate profile summary cards"
          git pull --rebase origin main
          git push origin HEAD:main
